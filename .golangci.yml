linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
  disable:
    - depguard
    - exhaustruct

linters-settings:
  misspell:
    locale: US
  goimports:
    local-prefixes: github.com/atop0914/containerdb-bootcamp

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - exhaustruct
    - path: examples/
      linters:
        - errcheck
  max-issues-per-linter: 50
  max-same-issues: 5

run:
  timeout: 5m
  tests: true
